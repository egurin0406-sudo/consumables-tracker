<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>消耗品トラッカー</title>
<meta name="theme-color" content="#4F46E5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="消耗品">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="app-header">
  <div class="header-top">
    <h1>消耗品トラッカー</h1>
    <button id="btn-household" class="household-badge hidden"></button>
  </div>
  <nav class="tabs">
    <button class="tab-btn active" data-tab="list">一覧</button>
    <button class="tab-btn" data-tab="calendar">カレンダー</button>
  </nav>
</header>

<main>
  <section id="tab-list" class="tab-panel active">
    <div id="empty-state" class="empty-state hidden">
      <p>登録された消耗品はまだありません。</p>
      <p>右下の + ボタンから追加しましょう。</p>
    </div>
    <div id="item-list" class="item-list"></div>
  </section>

  <section id="tab-calendar" class="tab-panel">
    <div class="calendar-header">
      <button id="cal-prev" aria-label="前の月">‹</button>
      <h2 id="cal-title"></h2>
      <button id="cal-next" aria-label="次の月">›</button>
    </div>
    <div class="calendar-weekdays">
      <span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span>
    </div>
    <div id="calendar-grid" class="calendar-grid"></div>
    <div id="cal-day-detail" class="cal-day-detail hidden"></div>
  </section>
</main>

<button id="fab-add" class="fab" aria-label="追加">+</button>

<div id="modal-overlay" class="modal-overlay hidden">
  <div class="modal">
    <h2 id="modal-title">消耗品を追加</h2>
    <form id="item-form">
      <label>
        カテゴリ (任意)
        <input type="text" id="f-category" list="category-options">
        <datalist id="category-options"></datalist>
      </label>

      <label>
        名前
        <input type="text" id="f-name" required>
      </label>

      <label>
        メモ (任意)
        <input type="text" id="f-note">
      </label>

      <div class="records-section">
        <span class="records-label">記録日</span>
        <ul id="records-list" class="records-list"></ul>
        <div class="add-record-row">
          <input type="date" id="f-new-record-date">
          <button type="button" id="btn-add-record" class="btn-secondary">追加</button>
        </div>
      </div>

      <div class="modal-actions">
        <button type="button" id="btn-delete" class="btn-danger hidden">削除</button>
        <div class="modal-actions-right">
          <button type="button" id="btn-cancel" class="btn-secondary">キャンセル</button>
          <button type="submit" class="btn-primary">保存</button>
        </div>
      </div>
    </form>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<div id="setup-overlay" class="modal-overlay">
  <div class="modal">
    <h2>家族と共有</h2>
    <p class="setup-desc">共有コードを新しく作るか、家族から教えてもらったコードを入力してください。同じコードを使う人同士でデータが共有されます。</p>

    <button id="btn-create-code" class="btn-primary setup-create-btn">新しいコードを作る</button>

    <div class="setup-divider">または</div>

    <form id="join-code-form">
      <label>
        共有コードを入力
        <input type="text" id="f-join-code" autocapitalize="characters" autocomplete="off">
      </label>
      <button type="submit" class="btn-secondary setup-join-btn">このコードで始める</button>
    </form>
  </div>
</div>

<div id="household-overlay" class="modal-overlay hidden">
  <div class="modal">
    <h2>共有コード</h2>
    <p class="setup-desc">このコードを家族に伝えると、同じデータを共有できます。</p>
    <div id="household-code-display" class="household-code-display"></div>
    <div class="modal-actions-right household-modal-actions">
      <button type="button" id="btn-close-household" class="btn-secondary">閉じる</button>
      <button type="button" id="btn-change-code" class="btn-danger">コードを変更する</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="app.js"></script>
</body>
</html>
